<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
<title id="title">Hey, I'm Heavenfiend — Android Developer</title>
<desc id="desc">A dark developer banner with purple lines and a neon green accent.</desc>
